# Cloudflare Tunnel ingress for the Muse Code CLI PWA.
#
# Replace <your-hostname> with the public hostname you want
# (e.g. muse.example.com). The tunnel itself is free.
#
# One-time setup:
#   cloudflared tunnel create muse-pwa
#   cloudflared tunnel route dns muse-pwa <your-hostname>
# Then paste your tunnel UUID below.
#
# The server binds 127.0.0.1 only — this tunnel is the sole public path.

tunnel: <tunnel-uuid>
credentials-file: ~/.cloudflared/<tunnel-uuid>.json

ingress:
  - hostname: <your-hostname>
    service: http://127.0.0.1:3091
  - service: http_status:404
